# Local Oracle Database 23ai Free for the study.
#   docker compose up -d          (first start takes a few minutes)
#   docker compose logs -f oracle (wait for "DATABASE IS READY TO USE!")
# Connect string: localhost:1521/FREEPDB1, user sqlrw / sqlrw (see docker/oracle-init)
services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: sqlrw-oracle
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: ${ORACLE_SYS_PASSWORD:-OracleSys123}
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./docker/oracle-init:/container-entrypoint-initdb.d:ro
    shm_size: "1gb"
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 120s

volumes:
  oracle-data:
